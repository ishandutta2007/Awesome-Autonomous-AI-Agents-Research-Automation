<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-text {
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic / Animated Ambient Light Orbs -->
  <g>
    <circle cx="150" cy="100" r="140" fill="#38bdf8" opacity="0.15" filter="url(#orbGlow)">
      <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.15;0.25;0.15" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="300" r="160" fill="#a855f7" opacity="0.18" filter="url(#orbGlow)">
      <animate attributeName="cy" values="300;230;300" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.18;0.3;0.18" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="380" r="180" fill="#6366f1" opacity="0.12" filter="url(#orbGlow)">
      <animate attributeName="cx" values="600;680;600" dur="14s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Background Agent Network Dataflow lines (in background behind text) -->
  <g opacity="0.4">
    <path d="M 80,340 Q 250,290 400,340 T 750,330 T 1120,340" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="6s" repeatCount="indefinite" />
    </path>
    <path d="M 120,380 Q 320,350 550,380 T 950,370 T 1100,380" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,6">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="8s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Floating Network Data Packets -->
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 80,340 Q 250,290 400,340 T 750,330 T 1120,340" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle r="4" fill="#c084fc" filter="url(#glow)">
    <animateMotion path="M 120,380 Q 320,350 550,380 T 950,370 T 1100,380" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Content: Header Tag / Pill -->
  <g transform="translate(60, 52)">
    <rect width="320" height="32" rx="16" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="pill-text" fill="#38bdf8">AUTONOMOUS RESEARCH ECOSYSTEM</text>
  </g>

  <!-- Foreground Content: Main Title (Safe from overlay) -->
  <g transform="translate(60, 140)">
    <text class="title" fill="url(#primaryGrad)" filter="url(#glow)">Autonomous AI Agents</text>
    <text x="495" y="0" class="title" fill="#ffffff">&amp; Research Automation</text>
  </g>

  <!-- Foreground Content: Subtitle / Value Proposition -->
  <g transform="translate(60, 185)">
    <text class="subtitle">Curated directory of autonomous deep research agents, scientific literature synthesis,</text>
    <text x="0" y="28" class="subtitle">headless web browsing executors, and multi-agent coordination frameworks.</text>
  </g>

  <!-- Interactive / Live-Look Feature Badges in Foreground -->
  <g transform="translate(60, 260)">
    <!-- Badge 1: Deep Research -->
    <g transform="translate(0, 0)">
      <rect width="190" height="42" rx="10" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="26" class="pill-text">🔍 Deep Web Research</text>
    </g>

    <!-- Badge 2: Academic Synthesis -->
    <g transform="translate(205, 0)">
      <rect width="185" height="42" rx="10" fill="url(#badgeGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="26" class="pill-text">📚 Literature Synthesis</text>
    </g>

    <!-- Badge 3: Web Browsing -->
    <g transform="translate(405, 0)">
      <rect width="180" height="42" rx="10" fill="url(#badgeGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="26" class="pill-text">🌐 Browser Executors</text>
    </g>

    <!-- Badge 4: Multi-Agent Crews -->
    <g transform="translate(600, 0)">
      <rect width="170" height="42" rx="10" fill="url(#badgeGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="26" class="pill-text">🤖 Multi-Agent Crews</text>
    </g>

    <!-- Badge 5: Full Observability -->
    <g transform="translate(785, 0)">
      <rect width="180" height="42" rx="10" fill="url(#badgeGrad)" stroke="#f472b6" stroke-width="1" stroke-opacity="0.4" />
      <text x="20" y="26" class="pill-text">📊 Agent Observability</text>
    </g>
  </g>

  <!-- Subtle Bottom Status Flow -->
  <g transform="translate(60, 350)">
    <text x="0" y="0" class="node-text">PIPELINE: Plan</text>
    <text x="100" y="0" class="node-text" fill="#64748b">→</text>
    <text x="120" y="0" class="node-text">Search &amp; Traverse</text>
    <text x="260" y="0" class="node-text" fill="#64748b">→</text>
    <text x="280" y="0" class="node-text">Scrape &amp; Parse</text>
    <text x="390" y="0" class="node-text" fill="#64748b">→</text>
    <text x="410" y="0" class="node-text">Critique &amp; Refine</text>
    <text x="535" y="0" class="node-text" fill="#64748b">→</text>
    <text x="555" y="0" class="node-text">Synthesize &amp; Cite</text>
  </g>
</svg>
